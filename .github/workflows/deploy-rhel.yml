name: Build and Deploy Fleet App on RHEL

# Only allow manual trigger via GitHub button
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Build Podman Image
        run: |
          podman build -t fleet-app:latest .

      - name: Restart Fleet App Container
        run: |
          # Gracefully stop existing container with a 10s timeout
          podman stop -t 10 fleet-app || true
          podman rm -f fleet-app || true
          
          # Allow kernel network stack to fully release port 8080
          sleep 2

          # Run the updated container
          podman run -d \
            --name fleet-app \
            -p 8080:8080 \
            -e SPRING_DATASOURCE_URL="jdbc:mysql://host.containers.internal:3306/fleet_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC" \
            -e SPRING_DATASOURCE_USERNAME="fleet_user" \
            -e SPRING_DATASOURCE_PASSWORD="UserPassword123!" \
            -e SPRING_DATASOURCE_DRIVER_CLASS_NAME="com.mysql.cj.jdbc.Driver" \
            -e FLEET_DB_URL="jdbc:mysql://host.containers.internal:3306/fleet_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC" \
            -e FLEET_DB_USER="fleet_user" \
            -e FLEET_DB_PASSWORD="UserPassword123!" \
            --restart unless-stopped \
            fleet-app:latest

      - name: Verify Container Startup
        run: |
          # Wait for Spring Boot context initialization
          sleep 10
          podman ps --filter "name=fleet-app"
          podman logs --tail 20 fleet-app
          sleep 5
          podman ps --filter "name=fleet-app"
