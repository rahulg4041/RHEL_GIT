name: Manual Build & Deploy to Azure VM

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, Transfer & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package

      - name: Copy JAR to /opt/fleet-management via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          source: "target/fleet-management-0.0.1-SNAPSHOT.jar"
          target: "/opt/fleet-management"
          strip_components: 1
          overwrite: true

      - name: Restart and Verify Service via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          port: 22
          script: |
            echo "Restarting fleet.service with updated build..."
            sudo /usr/bin/systemctl restart fleet.service
            sudo /usr/bin/systemctl status fleet.service --no-pager
