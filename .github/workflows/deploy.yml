name: CI/CD Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Test (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/fleet-management-0.0.1-SNAPSHOT.jar

  deploy:
    name: Deploy to Azure VM (CD)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: .

      - name: Copy JAR to /opt/fleet-management via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          source: "fleet-management-0.0.1-SNAPSHOT.jar"
          target: "/opt/fleet-management"
          overwrite: true

      - name: Restart and Verify Service via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          port: 22
          script: |
            echo "Restarting fleet.service with updated build..."
            sudo /usr/bin/systemctl restart fleet.service
            sudo /usr/bin/systemctl status fleet.service --no-pager